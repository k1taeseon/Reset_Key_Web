<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shot Count Reset</title>
    <style>
        body { background-color: #1e1e1e; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background-color: #2d2d2d; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        input { padding: 15px; font-size: 24px; text-align: center; width: 200px; border: 2px solid #555; border-radius: 5px; background-color: #121212; color: #fff; margin-bottom: 20px; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; background-color: #b0c24a; color: #1e1e1e; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #9cad3f; }
        #resultBox { margin-top: 30px; font-size: 32px; font-weight: bold; color: #b0c24a; min-height: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h2>DEVICE CODE</h2>
    <input type="text" id="deviceCode" maxlength="4" placeholder="Enter 4 digits">
    <br>
    <button onclick="generateCode()">GENERATE RESET CODE</button>
    <div id="resultBox"></div>
</div>

<script>
    async function generateCode() {
        const deviceCode = document.getElementById('deviceCode').value;
        const resultBox = document.getElementById('resultBox');
        
        if (deviceCode.length !== 4 || isNaN(deviceCode)) {
            resultBox.innerHTML = "Invalid Code";
            resultBox.style.color = "#ff4c4c";
            return;
        }

        resultBox.innerHTML = "Generating...";
        resultBox.style.color = "#fff";

        try {
            const response = await fetch(`/api/generate?device_code=${deviceCode}`);
            const data = await response.json();

            if (response.ok) {
                resultBox.innerHTML = `RESET CODE: ${data.reset_code}`;
                resultBox.style.color = "#b0c24a";
            } else {
                resultBox.innerHTML = "Error occurred";
            }
        } catch (error) {
            resultBox.innerHTML = "Network Error";
        }
    }
</script>

</body>
</html>
